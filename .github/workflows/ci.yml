name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ["1.22", "1.23"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Show toolchain
        run: |
          go version
          go env GOOS GOARCH

      - name: go mod download
        run: go mod download

      - name: go vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      # Static build path: this is the property the binary ships with.
      # CGO_ENABLED=0 here proves a fully static binary builds; the
      # test step below relaxes that so `-race` (which links the
      # cgo-backed race runtime) can run.
      - name: go build (static, CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o bk ./cmd/bk

      - name: bk version smoke test
        run: ./bk version

      # The race detector requires cgo. We test with CGO_ENABLED=1 to
      # get coverage from `-race`, separately from the static-binary
      # build above. Release artifacts are still built CGO_ENABLED=0
      # by goreleaser.
      - name: go test (with race detector; CGO_ENABLED=1)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          args: --timeout=5m
