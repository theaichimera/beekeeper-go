name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GH_PAT is a fine-grained token with `contents: write` on
          # theaichimera/homebrew-tap. Required for goreleaser to commit
          # the updated Formula/bk.rb into the tap on every stable tag.
          # If unset, goreleaser will fail the brews step. (See
          # `.goreleaser.yaml`'s brews.repository.token reference.)
          GH_PAT: ${{ secrets.GH_PAT }}
