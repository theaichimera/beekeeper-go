# Beekeeper Go release config.
#
# Produces a single static binary (`bk`) for darwin/linux on amd64/arm64,
# wires version/commit/date via ldflags, and publishes a GitHub release.
# Homebrew tap publishing is included but commented until a tap repo
# exists — uncomment once theaichimera/homebrew-tap is provisioned.

version: 2

project_name: beekeeper-go

before:
  hooks:
    - go mod download

builds:
  - id: bk
    main: ./cmd/bk
    binary: bk
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

# Homebrew tap publishing.
#
# Goreleaser will auto-update Formula/bk.rb in the tap repo on every
# tag-driven release. The tap repo (theaichimera/homebrew-tap) must
# exist and be writable by the GH_PAT env var that the release workflow
# injects.
#
# To dry-run locally without publishing:
#   goreleaser release --snapshot --clean --skip-publish
#
# A reference Formula is also kept in-tree at pkg/homebrew/Formula/bk.rb
# so reviewers can inspect what goreleaser will write before tagging.
brews:
  - name: bk
    repository:
      owner: theaichimera
      name: homebrew-tap
      token: "{{ .Env.GH_PAT }}"
    directory: Formula
    homepage: https://github.com/theaichimera/beekeeper-go
    description: Operations layer for beads (bd) — single-binary Go rewrite of beadkeeper.
    license: MIT
    commit_author:
      name: theaichimera
      email: theaichimera@users.noreply.github.com
    skip_upload: auto # only publish on stable tags (v[0-9]+...), skip pre-releases
    install: |
      bin.install "bk"
    test: |
      system "#{bin}/bk", "version"
    caveats: |
      bk is the Go port of beadkeeper (Python). Both operate on the same
      .beads/ directory and are interchangeable per-invocation.
      See https://github.com/theaichimera/beekeeper-go#interop-with-python-beadkeeper
